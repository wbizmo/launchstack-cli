name: Refresh dist artifacts

on:
  push:
    branches:
      - hardening/2-18-release

permissions:
  contents: write

jobs:
  refresh-dist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: hardening/2-18-release
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild distributable artifacts
        run: npm run build

      - name: Commit refreshed dist when needed
        shell: bash
        run: |
          if git diff --quiet -- dist; then
            echo "dist is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -f dist
          git commit -m "build: refresh generated dist artifacts"
          git push origin HEAD:hardening/2-18-release
