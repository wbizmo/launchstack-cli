name: Temporary sync published v3.0.7 GitHub release notes
on:
  push:
    branches:
      - docs/finalize-3.0.7-github-release
permissions:
  contents: write
jobs:
  update-notes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout release notes correction
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify immutable released commit and update GitHub release only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin --tags
          test "$(git rev-parse 'v3.0.7^{commit}')" = "7633e826a9b870fdf2cd54f0aa4ba9c82dc9d034"
          gh release view v3.0.7 >/dev/null
          gh release edit v3.0.7 --notes-file RELEASE_NOTES_3.0.7.md
