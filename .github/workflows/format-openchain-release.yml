name: Format LaunchStack OpenChain release files

on:
  push:
    branches:
      - docs/openchain-5230-18974-program-20261118

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: docs/openchain-5230-18974-program-20261118
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.3"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format compliance and release files
        run: |
          npx prettier --write \
            .github/workflows/ci.yml \
            .github/workflows/codeql.yml \
            .github/workflows/openchain-advisory-monitor.yml \
            .github/workflows/publish.yml \
            .github/workflows/release-openchain-3.0.7.yml \
            CHANGELOG.md \
            README.md \
            RELEASE_NOTES_3.0.7.md \
            SECURITY.md \
            THIRD_PARTY_NOTICES.md \
            docs/RELEASE_HISTORY.md \
            docs/RELEASING.md \
            docs/openchain \
            package.json \
            package-lock.json \
            scripts/final-release-audit.cjs \
            scripts/openchain-dispositions.cjs \
            scripts/openchain-evidence.cjs \
            src/templates/api/LICENSE \
            src/templates/api/README.md \
            src/templates/api/THIRD_PARTY_NOTICES.md \
            src/templates/api/package.json \
            src/templates/api/package-lock.json \
            tests/openchain-dispositions.test.ts \
            tests/openchain-evidence.test.ts

      - name: Commit formatting if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "All targeted files already satisfy Prettier."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/ci.yml \
            .github/workflows/codeql.yml \
            .github/workflows/openchain-advisory-monitor.yml \
            .github/workflows/publish.yml \
            .github/workflows/release-openchain-3.0.7.yml \
            CHANGELOG.md README.md RELEASE_NOTES_3.0.7.md SECURITY.md \
            THIRD_PARTY_NOTICES.md docs package.json package-lock.json \
            scripts src/templates/api tests/openchain-dispositions.test.ts \
            tests/openchain-evidence.test.ts
          git commit -m "style: format LaunchStack OpenChain release files"
          git push origin HEAD:docs/openchain-5230-18974-program-20261118
