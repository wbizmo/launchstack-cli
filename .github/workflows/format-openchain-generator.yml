name: Format OpenChain evidence generator

on:
  push:
    branches:
      - docs/openchain-5230-18974-program-20261118

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: docs/openchain-5230-18974-program-20261118
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.3"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format generator
        run: npx prettier --write scripts/openchain-evidence.cjs

      - name: Commit if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- scripts/openchain-evidence.cjs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/openchain-evidence.cjs
          git commit -m "style: format OpenChain evidence generator"
          git push origin HEAD:docs/openchain-5230-18974-program-20261118
