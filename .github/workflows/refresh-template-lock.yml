name: Refresh template lock

on:
  push:
    branches:
      - hardening/2-18-release

permissions:
  contents: write

jobs:
  refresh-template-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: hardening/2-18-release
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Refresh generated API dependency graph
        working-directory: src/templates/api
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit --omit=dev --audit-level=high

      - name: Refresh packaged templates
        run: npm run copy:templates

      - name: Commit refreshed lock and remove helper workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/templates/api/package-lock.json
          git add -A -f dist/templates/api
          git rm .github/workflows/refresh-template-lock.yml
          git commit -m "security: patch generated Prisma transitive dependency"
          git push origin HEAD:hardening/2-18-release
