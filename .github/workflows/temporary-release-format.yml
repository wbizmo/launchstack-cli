name: Temporary format 3.0.7 release docs
on:
  push:
    branches:
      - fix/openchain-template-sbom-and-openssf-20261118
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Setup pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.3"
          cache: npm
      - name: Install lockfile dependencies
        run: npm ci
      - name: Format the three flagged files
        run: npx --no-install prettier --write docs/RELEASE_HISTORY.md docs/RELEASING.md tests/release/openchain-release-workflow.test.ts
      - name: Commit formatting output
        shell: bash
        run: |
          set -euo pipefail
          git add -- docs/RELEASE_HISTORY.md docs/RELEASING.md tests/release/openchain-release-workflow.test.ts
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style: format 3.0.7 release documentation"
            git push origin "HEAD:fix/openchain-template-sbom-and-openssf-20261118"
          fi
