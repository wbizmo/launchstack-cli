name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      authorize_publication:
        description: Explicitly authorize publishing the package version on main
        type: boolean
        required: true
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.authorize_publication == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm-publish

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: launchstack_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d launchstack_smoke"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout main release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node.js for npm
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Resolve and validate release version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          NOTES="RELEASE_NOTES_${VERSION}.md"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::This workflow only publishes stable X.Y.Z package versions, found ${VERSION}"
            exit 1
          fi
          if [ ! -f "$NOTES" ]; then
            echo "::error::Missing $NOTES"
            exit 1
          fi
          if npm view "launchstack-cli@${VERSION}" version >/dev/null 2>&1; then
            echo "::error::launchstack-cli@${VERSION} is already published"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag matches package version
        run: npm run release:verify-tag
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}

      - name: Run release quality gate
        run: npm run release:check
        env:
          LAUNCHSTACK_SMOKE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/launchstack_smoke

      - name: Build OpenChain release evidence
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          DECLARATION="docs/openchain/CONFORMANCE-DECLARATION-${RELEASE_VERSION}.md"
          if [ ! -f "$DECLARATION" ]; then
            echo "::error::Missing versioned OpenChain declaration: $DECLARATION"
            exit 1
          fi

          rm -rf openchain-evidence
          mkdir -p openchain-evidence/program-docs
          node scripts/openchain-evidence.cjs --output openchain-evidence --archive-sources

          npm sbom --omit=dev --sbom-format=cyclonedx > openchain-evidence/launchstack-cli.cdx.json
          (
            cd src/templates/api
            npm sbom --omit=dev --sbom-format=cyclonedx
          ) > openchain-evidence/generated-api-template.cdx.json

          set +e
          npm audit --omit=dev --audit-level=low --json > openchain-evidence/launchstack-cli-audit.json
          CLI_AUDIT=$?
          (
            cd src/templates/api
            npm audit --omit=dev --audit-level=low --json
          ) > openchain-evidence/generated-api-template-audit.json
          TEMPLATE_AUDIT=$?
          set -e

          node scripts/openchain-dispositions.cjs \
            openchain-evidence/component-records.json \
            openchain-evidence/launchstack-cli-audit.json \
            openchain-evidence/generated-api-template-audit.json \
            openchain-evidence/vulnerability-dispositions.json

          cp -R docs/openchain/. openchain-evidence/program-docs/
          cp THIRD_PARTY_NOTICES.md openchain-evidence/
          cp SECURITY.md openchain-evidence/

          PACK_JSON="$(npm pack --json --silent)"
          PACK_FILE="$(node -e 'const x=JSON.parse(process.argv[1]);process.stdout.write(x[0].filename)' "$PACK_JSON")"
          mv "$PACK_FILE" "openchain-evidence/$PACK_FILE"

          (
            cd openchain-evidence
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )
          tar -czf "launchstack-openchain-evidence-${RELEASE_VERSION}.tar.gz" openchain-evidence

          if [ "$CLI_AUDIT" -ne 0 ] || [ "$TEMPLATE_AUDIT" -ne 0 ]; then
            echo "::error::A production dependency audit reported a known vulnerability or failed."
            exit 1
          fi

      - name: Verify npm publish token is configured
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.LAUNCHSTACK_NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::npm publishing credentials are not configured"
            exit 1
          fi

      - name: Create release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            TAG_SHA="$(git rev-parse "${RELEASE_TAG}^{commit}")"
            if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
              if ! git merge-base --is-ancestor "$TAG_SHA" "$GITHUB_SHA"; then
                echo "::error::${RELEASE_TAG} is not an ancestor of the dispatched main commit"
                exit 1
              fi

              while IFS= read -r -d '' changed_path; do
                case "$changed_path" in
                  README.md|CHANGELOG.md|LICENSE|RELEASE_NOTES_*.md|docs/*|src/templates/api/README.md|dist/templates/api/README.md|.github/workflows/publish.yml)
                    ;;
                  *)
                    echo "::error::Change after ${RELEASE_TAG} is outside release documentation: ${changed_path}"
                    exit 1
                    ;;
                esac
              done < <(git diff --no-renames --name-only -z "$TAG_SHA" "$GITHUB_SHA")
            fi
            echo "Using existing ${RELEASE_TAG} tag at ${TAG_SHA}; no tag was changed."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" -m "LaunchStack CLI ${RELEASE_TAG}"
            git push origin "$RELEASE_TAG"
          fi

      - name: Publish package to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.LAUNCHSTACK_NPM_TOKEN }}

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_NOTES: ${{ steps.release.outputs.notes }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "LaunchStack CLI v${RELEASE_VERSION}" \
              --notes-file "$RELEASE_NOTES"
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "LaunchStack CLI v${RELEASE_VERSION}" \
              --notes-file "$RELEASE_NOTES"
          fi
          gh release upload "$RELEASE_TAG" "launchstack-openchain-evidence-${RELEASE_VERSION}.tar.gz" --clobber
