name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      authorize_publication:
        description: Explicitly authorize publishing the package version on main
        type: boolean
        required: true
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.authorize_publication == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm-publish

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: launchstack_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d launchstack_smoke"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout main release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node.js for npm
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Resolve and validate release version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          NOTES="RELEASE_NOTES_${VERSION}.md"

          if [ "$VERSION" != "3.0.5" ]; then
            echo "::error::This approval workflow is scoped to v3.0.5, found ${VERSION}"
            exit 1
          fi
          if [ ! -f "$NOTES" ]; then
            echo "::error::Missing $NOTES"
            exit 1
          fi
          if npm view "launchstack-cli@${VERSION}" version >/dev/null 2>&1; then
            echo "::error::launchstack-cli@${VERSION} is already published"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag matches package version
        run: npm run release:verify-tag
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}

      - name: Run release quality gate
        run: npm run release:check
        env:
          LAUNCHSTACK_SMOKE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/launchstack_smoke

      - name: Verify npm publish token is configured
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.LAUNCHSTACK_NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::npm publishing credentials are not configured"
            exit 1
          fi

      - name: Create release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            TAG_SHA="$(git rev-parse "${RELEASE_TAG}^{commit}")"
            if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
              if ! git merge-base --is-ancestor "$TAG_SHA" "$GITHUB_SHA"; then
                echo "::error::${RELEASE_TAG} is not an ancestor of the dispatched main commit"
                exit 1
              fi

              while IFS= read -r changed_path; do
                case "$changed_path" in
                  README.md|CHANGELOG.md|LICENSE|RELEASE_NOTES_*.md|docs/*|src/templates/api/README.md|dist/templates/api/README.md|.github/workflows/publish.yml)
                    ;;
                  *)
                    echo "::error::Change after ${RELEASE_TAG} is outside release documentation: ${changed_path}"
                    exit 1
                    ;;
                esac
              done < <(git diff --no-renames --name-only -z "$TAG_SHA" "$GITHUB_SHA")
            fi
            echo "Using existing ${RELEASE_TAG} tag at ${TAG_SHA}; no tag was changed."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" -m "LaunchStack CLI ${RELEASE_TAG}"
            git push origin "$RELEASE_TAG"
          fi

      - name: Publish package to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.LAUNCHSTACK_NPM_TOKEN }}

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_NOTES: ${{ steps.release.outputs.notes }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "LaunchStack CLI v${RELEASE_VERSION}" \
              --notes-file "$RELEASE_NOTES"
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "LaunchStack CLI v${RELEASE_VERSION}" \
              --notes-file "$RELEASE_NOTES"
          fi
