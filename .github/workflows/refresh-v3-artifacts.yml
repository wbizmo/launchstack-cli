name: Refresh v3 generated artifacts

on:
  push:
    branches:
      - feat/lifecycle-v3

permissions:
  contents: write

jobs:
  refresh:
    if: "${{ github.event.head_commit.message != 'chore: refresh v3 generated artifacts' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Refresh root lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install exact dependencies
        run: npm ci
      - name: Refresh generated template lockfile
        run: npm run locks:template
      - name: Build committed artifacts
        run: npm run build
      - name: Commit generated artifacts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json src/templates/api/package-lock.json
          git add -f dist
          if git diff --cached --quiet; then
            echo "Generated artifacts already current."
            exit 0
          fi
          git commit -m "chore: refresh v3 generated artifacts"
          git push origin HEAD:feat/lifecycle-v3
      - name: Upload generated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: launchstack-v3-generated
          if-no-files-found: error
          path: |
            package-lock.json
            src/templates/api/package-lock.json
            dist
