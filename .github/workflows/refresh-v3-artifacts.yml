name: Refresh v3 generated artifacts

on:
  push:
    branches:
      - feat/lifecycle-v3

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Refresh root lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install exact dependencies
        run: npm ci
      - name: Refresh generated template lockfile
        run: npm run locks:template
      - name: Build committed artifacts
        run: npm run build
      - name: Upload generated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: launchstack-v3-generated
          if-no-files-found: error
          path: |
            package-lock.json
            src/templates/api/package-lock.json
            dist
