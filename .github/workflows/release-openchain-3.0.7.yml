name: Release LaunchStack CLI 3.0.7 OpenChain candidate

on:
  push:
    branches:
      - release/openchain-3.0.7

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: npm-publish

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: launchstack_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d launchstack_smoke"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify exact protected-main release commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          MAIN_SHA="$(git rev-parse origin/main)"
          if [ "$GITHUB_SHA" != "$MAIN_SHA" ]; then
            echo "::error::Release branch is not the exact current main commit."
            exit 1
          fi
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "3.0.7" ]; then
            echo "::error::This one-time workflow only permits launchstack-cli@3.0.7."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.3"
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install exact dependencies
        run: npm ci

      - name: Run full release qualification
        run: npm run release:check
        env:
          LAUNCHSTACK_SMOKE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/launchstack_smoke

      - name: Build exact OpenChain release evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf openchain-evidence
          mkdir -p openchain-evidence

          node scripts/openchain-evidence.cjs --output openchain-evidence --archive-sources
          npm sbom --omit=dev --sbom-format=cyclonedx > openchain-evidence/launchstack-cli.cdx.json
          (
            cd src/templates/api
            npm sbom --omit=dev --sbom-format=cyclonedx
          ) > openchain-evidence/generated-api-template.cdx.json

          set +e
          npm audit --omit=dev --audit-level=low --json > openchain-evidence/launchstack-cli-audit.json
          CLI_AUDIT=$?
          (
            cd src/templates/api
            npm audit --omit=dev --audit-level=low --json
          ) > openchain-evidence/generated-api-template-audit.json
          TEMPLATE_AUDIT=$?
          set -e

          node scripts/openchain-dispositions.cjs \
            docs/openchain/COMPONENT-RECORDS-3.0.7.json \
            openchain-evidence/launchstack-cli-audit.json \
            openchain-evidence/generated-api-template-audit.json \
            openchain-evidence/VULNERABILITY-DISPOSITIONS-3.0.7.json

          cp docs/openchain/COMPONENT-RECORDS-3.0.7.json openchain-evidence/
          cp docs/openchain/SELF-ASSESSMENT.md openchain-evidence/
          cp docs/openchain/PROGRAM-RECORD-2026-11-18.md openchain-evidence/
          cp docs/openchain/REVIEW-2026-11-18.md openchain-evidence/
          cp docs/openchain/CONFORMANCE-DECLARATION-3.0.7.md openchain-evidence/
          cp THIRD_PARTY_NOTICES.md openchain-evidence/
          cp SECURITY.md openchain-evidence/

          PACK_JSON="$(npm pack --json --silent)"
          PACK_FILE="$(node -e 'const x=JSON.parse(process.argv[1]);process.stdout.write(x[0].filename)' "$PACK_JSON")"
          mv "$PACK_FILE" "openchain-evidence/$PACK_FILE"

          (
            cd openchain-evidence
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )
          tar -czf launchstack-openchain-evidence-3.0.7.tar.gz openchain-evidence

          if [ "$CLI_AUDIT" -ne 0 ] || [ "$TEMPLATE_AUDIT" -ne 0 ]; then
            echo "::error::A production dependency audit reported a known vulnerability or failed."
            exit 1
          fi

      - name: Check whether npm version is already published
        id: publication
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --tags --force
          if npm view launchstack-cli@3.0.7 version >/dev/null 2>&1; then
            if ! git rev-parse -q --verify "refs/tags/v3.0.7" >/dev/null; then
              echo "::error::npm 3.0.7 exists without a matching repository tag."
              exit 1
            fi
            if [ "$(git rev-parse 'v3.0.7^{commit}')" != "$GITHUB_SHA" ]; then
              echo "::error::Existing v3.0.7 tag does not match this release commit."
              exit 1
            fi
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require npm publication credential
        if: steps.publication.outputs.already_published != 'true'
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.LAUNCHSTACK_NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::LAUNCHSTACK_NPM_TOKEN is not configured."
            exit 1
          fi

      - name: Create immutable release tag
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/v3.0.7" >/dev/null; then
            test "$(git rev-parse 'v3.0.7^{commit}')" = "$GITHUB_SHA"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a v3.0.7 -m "LaunchStack CLI v3.0.7"
            git push origin v3.0.7
          fi

      - name: Publish npm package with provenance
        if: steps.publication.outputs.already_published != 'true'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.LAUNCHSTACK_NPM_TOKEN }}

      - name: Create or repair GitHub release and evidence attachment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v3.0.7 >/dev/null 2>&1; then
            gh release edit v3.0.7 --title "LaunchStack CLI v3.0.7" --notes-file RELEASE_NOTES_3.0.7.md
          else
            gh release create v3.0.7 --verify-tag --title "LaunchStack CLI v3.0.7" --notes-file RELEASE_NOTES_3.0.7.md
          fi
          gh release upload v3.0.7 launchstack-openchain-evidence-3.0.7.tar.gz --clobber
