name: Open source dependency advisory monitoring

# Complements CodeQL by scanning the CLI and generated API template lockfiles
# even when main has no changes. Not a substitute for historical release SBOMs.
on:
  schedule:
    - cron: "23 6 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-advisories:
    name: CLI and generated API template advisory audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.3"
          cache: npm

      - name: Audit CLI production and development dependencies
        run: npm audit --audit-level=low

      - name: Audit included generated API template dependencies
        working-directory: src/templates/api
        run: npm audit --audit-level=low
