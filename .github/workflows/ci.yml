name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - hardening/2-18-release

permissions:
  contents: read

jobs:
  windows-portability:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check formatting and lint
        run: |
          npm run format:check
          npm run lint
      - name: Typecheck, test and build
        run: |
          npm run typecheck
          npm run test:run
          npm run build

  release-gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [24.22.3, 26.13.1]

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: launchstack_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d launchstack_smoke"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Run release quality gate
        run: npm run release:check
        env:
          LAUNCHSTACK_SMOKE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/launchstack_smoke

      - name: Build and run generated production Docker image
        run: npm run docker:template:smoke
